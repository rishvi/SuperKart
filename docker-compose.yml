services:
  backend:
    build: ./backend_files
    container_name: backend
    ports:
      - "7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend_files
    container_name: frontend
    environment:
      BACKEND_URL: http://backend:7860
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
